<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SYLFT · Tareas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300..600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  /* ---------- Captura rápida ---------- */
  #new-title { width: 100%; }
  .quick-row { display: flex; gap: 6px; margin-top: 8px; }
  .quick-row select, .quick-row input { flex: 1; padding: 8px 6px; font-size: 13px; min-width: 0; }
  .quick-row select { padding-right: 24px; background-position: right 8px center; }
  .quick-row button { padding: 8px 18px; font-size: 18px; line-height: 1; }

  /* ---------- Grupos ---------- */
  .grupo-titulo {
    margin: 22px 2px 2px; display: flex; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--faint);
  }
  .grupo-titulo .dot { width: 6px; height: 6px; border-radius: 50%; align-self: center; }

  /* ---------- Tarea ---------- */
  .task {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-top: 8px;
  }
  .task .chk {
    width: 21px; height: 21px; min-width: 21px; border-radius: 6px;
    border: 1.5px solid var(--faint); background: transparent; padding: 0;
    display: grid; place-items: center; color: transparent; font-size: 12px;
  }
  .task.done .chk { border-color: var(--accent-deep); background: var(--accent-deep); color: #fff; }
  .task .cuerpo { flex: 1; min-width: 0; }
  .task .titulo { font-size: 0.95rem; word-break: break-word; }
  .task.done .titulo { text-decoration: line-through; color: var(--muted); }
  .task .meta {
    margin-top: 3px; display: flex; gap: 10px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--faint);
  }
  .task .del {
    background: transparent; color: var(--faint); border: none;
    padding: 4px 6px; font-size: 0.95rem;
  }
  .pri-alta { color: var(--danger); } .pri-media { color: var(--warn); } .pri-baja { color: var(--faint); }
  .dl-vencida { color: var(--danger); font-weight: 500; }
  .dl-urgente { color: var(--warn); }
  .dl-normal { color: var(--faint); }
  #toggle-done {
    margin-top: 22px; width: 100%; padding: 9px;
    background: transparent; border: 1px dashed var(--line); color: var(--faint);
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  }
  .screen-fade { animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="view-login" class="hidden login-wrap">
  <div class="logo">Sylft</div>
  <div class="mono-label" style="margin-top:6px">Sistema personal · Tareas</div>
  <div class="card">
    <input id="email" type="email" placeholder="Correo" autocomplete="username" style="width:100%">
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%;margin-top:10px">
    <button id="btn-login" class="btn-primary w100">Entrar</button>
    <div id="msg"></div>
  </div>
</div>

<!-- APP -->
<div id="view-app" class="hidden screen-fade">
  <div class="brand-row">
    <div class="brand">Sylft <small>· Tareas</small></div>
    <div class="links"><a href="#" id="btn-logout">Salir</a></div>
  </div>

  <h1 class="page-title">Tareas</h1>
  <div id="resumen" class="mono-label page-sub"></div>

  <!-- Captura rápida -->
  <div class="card">
    <input id="new-title" placeholder="Nueva tarea…" autocomplete="off">
    <div class="quick-row">
      <select id="new-origin">
        <option value="escuela">Escuela</option>
        <option value="wolves">Wolves</option>
        <option value="levelup">LevelUp</option>
        <option value="personal">Personal</option>
      </select>
      <select id="new-priority">
        <option value="alta">Alta</option>
        <option value="media" selected>Media</option>
        <option value="baja">Baja</option>
      </select>
      <input type="date" id="new-deadline">
      <button id="btn-add" class="btn-primary">+</button>
    </div>
  </div>

  <div id="listas"></div>
  <button id="toggle-done">Completadas (0)</button>
  <div id="lista-done" class="hidden"></div>
</div>

<!-- Nav inferior -->
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Inicio</span></a>
    <a class="nav-item" href="gym.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
      <span>Gym</span></a>
    <a class="nav-item on" href="tareas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12l2.2 2.2L15.5 9.5"/></svg>
      <span>Tareas</span></a>
    <a class="nav-item" href="dieta.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v7a2.5 2.5 0 0 0 5 0V3"/><path d="M9.5 3v18"/><path d="M17 3c-1.5 2-2 4-2 6 0 2.5 1 3 2 3v9"/></svg>
      <span>Dieta</span></a>
  </div>
</nav>

<script>
const { createClient } = supabase;
const sb = createClient(PRTS_CONFIG.SUPABASE_URL, PRTS_CONFIG.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);

const ORIGENES = {
  escuela:  { label: "Escuela",  color: "var(--accent)" },
  wolves:   { label: "Wolves",   color: "var(--warn)" },
  levelup:  { label: "LevelUp",  color: "var(--ok)" },
  personal: { label: "Personal", color: "#B49FD9" },
};
const PESO_PRI = { alta: 0, media: 1, baja: 2 };

function hoyMX() {
  return new Date().toLocaleDateString("en-CA", { timeZone: "America/Mexico_City" });
}

function deadlineInfo(dl) {
  if (!dl) return null;
  const hoy = hoyMX();
  const dias = Math.round((new Date(dl + "T12:00") - new Date(hoy + "T12:00")) / 864e5);
  if (dias < 0)  return { txt: `vencida hace ${-dias}d`, cls: "dl-vencida" };
  if (dias === 0) return { txt: "hoy", cls: "dl-vencida" };
  if (dias === 1) return { txt: "mañana", cls: "dl-urgente" };
  if (dias <= 2)  return { txt: `en ${dias} días`, cls: "dl-urgente" };
  return { txt: new Date(dl + "T12:00").toLocaleDateString("es-MX", { day: "numeric", month: "short" }), cls: "dl-normal" };
}

// ---------- AUTH ----------
$("btn-login").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) $("msg").textContent = error.message; else init();
};
$("btn-logout").onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };

// ---------- CRUD ----------
async function addTask() {
  const title = $("new-title").value.trim();
  if (!title) return;
  $("btn-add").disabled = true;
  const { error } = await sb.from("tasks").insert({
    title,
    origin: $("new-origin").value,
    priority: $("new-priority").value,
    deadline: $("new-deadline").value || null,
  });
  $("btn-add").disabled = false;
  if (error) { alert(error.message); return; }
  $("new-title").value = "";
  $("new-deadline").value = "";
  $("new-title").focus();
  cargar();
}

async function setStatus(id, status) {
  await sb.from("tasks").update({
    status,
    completed_at: status === "completada" ? new Date().toISOString() : null,
  }).eq("id", id);
  cargar();
}

async function editar(t) {
  const nuevo = prompt("Editar tarea:", t.title);
  if (nuevo === null || !nuevo.trim() || nuevo === t.title) return;
  await sb.from("tasks").update({ title: nuevo.trim() }).eq("id", t.id);
  cargar();
}

async function borrar(id) {
  if (!confirm("¿Eliminar esta tarea?")) return;
  await sb.from("tasks").delete().eq("id", id);
  cargar();
}

// ---------- RENDER ----------
function filaTarea(t) {
  const done = t.status === "completada";
  const dl = deadlineInfo(t.deadline);
  const div = document.createElement("div");
  div.className = "task" + (done ? " done" : "");
  div.innerHTML = `
    <button class="chk" title="${done ? "Reabrir" : "Completar"}">✓</button>
    <div class="cuerpo">
      <div class="titulo">${t.title.replace(/</g, "&lt;")}</div>
      <div class="meta">
        <span style="color:${ORIGENES[t.origin].color}">${ORIGENES[t.origin].label}</span>
        <span class="pri-${t.priority}">${t.priority}</span>
        ${dl ? `<span class="${dl.cls}">${dl.txt}</span>` : ""}
      </div>
    </div>
    <button class="del">${done ? "🗄" : "✕"}</button>`;
  div.querySelector(".chk").onclick = () => setStatus(t.id, done ? "pendiente" : "completada");
  div.querySelector(".titulo").onclick = () => !done && editar(t);
  div.querySelector(".del").onclick = () => done ? setStatus(t.id, "archivada") : borrar(t.id);
  return div;
}

async function cargar() {
  const { data: tasks, error } = await sb.from("tasks")
    .select("*").neq("status", "archivada")
    .order("deadline", { ascending: true, nullsFirst: false });
  if (error) { alert(error.message); return; }

  const pend = tasks.filter(t => t.status === "pendiente")
    .sort((a, b) => (a.deadline || "9999") < (b.deadline || "9999") ? -1 :
                    (a.deadline || "9999") > (b.deadline || "9999") ? 1 :
                    PESO_PRI[a.priority] - PESO_PRI[b.priority]);
  const done = tasks.filter(t => t.status === "completada")
    .sort((a, b) => (b.completed_at || "").localeCompare(a.completed_at || ""));

  const urgentes = pend.filter(t => t.deadline && deadlineInfo(t.deadline).cls !== "dl-normal").length;
  $("resumen").textContent = `${pend.length} ${pend.length === 1 ? "PENDIENTE" : "PENDIENTES"}` +
    (urgentes ? ` · ${urgentes} ${urgentes === 1 ? "URGENTE" : "URGENTES"}` : "");

  const cont = $("listas");
  cont.innerHTML = "";
  for (const key of Object.keys(ORIGENES)) {
    const grupo = pend.filter(t => t.origin === key);
    if (!grupo.length) continue;
    const h = document.createElement("div");
    h.className = "grupo-titulo";
    h.innerHTML = `<span class="dot" style="background:${ORIGENES[key].color}"></span>${ORIGENES[key].label} · ${grupo.length}`;
    cont.appendChild(h);
    grupo.forEach(t => cont.appendChild(filaTarea(t)));
  }
  if (!pend.length) cont.innerHTML = `<div class="card muted">Sin pendientes. Tu sistema, en orden.</div>`;

  $("toggle-done").textContent = `Completadas (${done.length})`;
  const ld = $("lista-done");
  ld.innerHTML = "";
  done.slice(0, 20).forEach(t => ld.appendChild(filaTarea(t)));
}

// ---------- ARRANQUE ----------
function show(id) {
  $("view-login").classList.add("hidden"); $("view-app").classList.add("hidden");
  $(id).classList.remove("hidden");
  $("navbar").classList.toggle("hidden", id === "view-login");
}

async function init() {
  show("view-app");
  $("btn-add").onclick = addTask;
  $("new-title").onkeydown = (e) => { if (e.key === "Enter") addTask(); };
  $("toggle-done").onclick = () => $("lista-done").classList.toggle("hidden");
  cargar();
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  session ? init() : show("view-login");
})();

// PWA: registrar service worker
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
