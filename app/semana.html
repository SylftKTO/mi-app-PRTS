<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SYLFT · Semana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300..600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  /* ---------- Vista general semanal ---------- */
  #overview { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 14px; }
  .ov-col { cursor: pointer; }
  .ov-col .d {
    text-align: center; font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.1em; color: var(--faint); padding-bottom: 5px;
  }
  .ov-col.on .d { color: var(--accent); font-weight: 500; }
  .ov-col .track {
    position: relative; height: 150px; border-radius: 7px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .ov-col.on .track { border-color: var(--accent-deep); }
  .ov-block { position: absolute; left: 3px; right: 3px; border-radius: 3px; min-height: 3px; opacity: 0.9; }

  .leyenda { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
  .leyenda span {
    display: flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint);
  }
  .leyenda i { width: 8px; height: 8px; border-radius: 2px; }

  /* ---------- Día seleccionado ---------- */
  #dia-titulo { margin: 22px 2px 0; display: flex; align-items: baseline; gap: 8px; }
  #dia-titulo h2 { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; }
  #dia-titulo .h { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }

  .bloque {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--faint);
    border-radius: 12px; padding: 12px 14px; margin-top: 8px;
  }
  .bloque .hora {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    min-width: 76px; line-height: 1.5; cursor: pointer;
  }
  .bloque .cuerpo { flex: 1; min-width: 0; }
  .bloque .titulo { font-size: 0.95rem; word-break: break-word; }
  .bloque .rol {
    margin-top: 2px; font-family: var(--mono); font-size: 9px;
    letter-spacing: 0.14em; text-transform: uppercase;
  }
  .bloque .solapa { color: var(--warn); font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2px; }
  .bloque .del { background: transparent; color: var(--faint); border: none; padding: 4px 6px; font-size: 0.95rem; }

  /* ---------- Alta de bloque ---------- */
  .quick-row { display: flex; gap: 6px; margin-top: 8px; }
  .quick-row select, .quick-row input { flex: 1; padding: 8px 6px; font-size: 13px; min-width: 0; }
  .quick-row select { padding-right: 24px; background-position: right 8px center; }
  .quick-row button { padding: 8px 18px; font-size: 18px; line-height: 1; }
  #new-label { width: 100%; }

  .screen-fade { animation: fade 0.25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="view-login" class="hidden login-wrap">
  <div class="logo">Sylft</div>
  <div class="mono-label" style="margin-top:6px">Sistema personal · Semana</div>
  <div class="card">
    <input id="email" type="email" placeholder="Correo" autocomplete="username" style="width:100%">
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" style="width:100%;margin-top:10px">
    <button id="btn-login" class="btn-primary w100">Entrar</button>
    <div id="msg"></div>
  </div>
</div>

<!-- APP -->
<div id="view-app" class="hidden screen-fade">
  <div class="brand-row">
    <div class="brand">Sylft <small>· Semana</small></div>
    <div class="links"><a href="index.html">Inicio</a><a href="#" id="btn-logout">Salir</a></div>
  </div>

  <h1 class="page-title">Semana</h1>
  <div id="resumen" class="mono-label page-sub">Plantilla de bloques · toca un día</div>

  <div id="overview"></div>
  <div class="leyenda" id="leyenda"></div>

  <!-- Alta de bloque -->
  <div class="card">
    <input id="new-label" placeholder="Nuevo bloque… (p. ej. Cálculo, Clase Wolves)" autocomplete="off">
    <div class="quick-row">
      <select id="new-day"></select>
      <input type="time" id="new-start" step="300">
      <input type="time" id="new-end" step="300">
    </div>
    <div class="quick-row">
      <select id="new-role"></select>
      <button id="btn-add" class="btn-primary">+</button>
    </div>
  </div>

  <div id="dia-titulo"><h2></h2><span class="h"></span></div>
  <div id="lista-dia"></div>
</div>

<!-- Nav inferior -->
<nav class="navbar" id="navbar">
  <div class="nav-inner">
    <a class="nav-item" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>Inicio</span></a>
    <a class="nav-item" href="gym.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>
      <span>Gym</span></a>
    <a class="nav-item" href="tareas.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 12l2.2 2.2L15.5 9.5"/></svg>
      <span>Tareas</span></a>
    <a class="nav-item" href="dieta.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 3v7a2.5 2.5 0 0 0 5 0V3"/><path d="M9.5 3v18"/><path d="M17 3c-1.5 2-2 4-2 6 0 2.5 1 3 2 3v9"/></svg>
      <span>Dieta</span></a>
    <a class="nav-item" href="apuntes.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Apuntes</span></a>
  </div>
</nav>

<script>
const { createClient } = supabase;
const sb = createClient(PRTS_CONFIG.SUPABASE_URL, PRTS_CONFIG.SUPABASE_ANON_KEY);
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/</g, "&lt;");

// weekday: convención JS getDay() → 0=Dom … 6=Sáb. Se muestra Lun→Dom.
const ORDEN = [1, 2, 3, 4, 5, 6, 0];
const DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
const DIAS_CORTO = ["D", "L", "M", "X", "J", "V", "S"];
const ROLES = {
  escuela:  { label: "Escuela",  color: "var(--accent)" },
  gym:      { label: "Gym",      color: "#84C2BC" },
  wolves:   { label: "Wolves",   color: "var(--warn)" },
  levelup:  { label: "LevelUp",  color: "var(--ok)" },
  personal: { label: "Personal", color: "#B49FD9" },
};
const H_INI = 6, H_FIN = 23;   // rango visible del overview (6:00–23:00)

let bloques = [];
let diaSel = (() => {
  const s = new Date().toLocaleDateString("en-CA", { timeZone: "America/Mexico_City" });
  return new Date(s + "T12:00:00").getDay();
})();

const mins = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const hhmm = (t) => t.slice(0, 5);

// ---------- AUTH ----------
$("btn-login").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("password").value });
  if (error) $("msg").textContent = error.message; else init();
};
$("btn-logout").onclick = async (e) => { e.preventDefault(); await sb.auth.signOut(); location.reload(); };

// ---------- CRUD ----------
async function addBlock() {
  const label = $("new-label").value.trim();
  const start = $("new-start").value, end = $("new-end").value;
  if (!label || !start || !end) return;
  if (mins(end) <= mins(start)) { alert("La hora de fin debe ser mayor que la de inicio."); return; }
  $("btn-add").disabled = true;
  const { error } = await sb.from("week_blocks").insert({
    weekday: Number($("new-day").value),
    start_time: start, end_time: end,
    role: $("new-role").value, label,
  });
  $("btn-add").disabled = false;
  if (error) { alert(error.message); return; }
  diaSel = Number($("new-day").value);
  $("new-label").value = "";
  cargar();
}

async function editarLabel(b) {
  const nuevo = prompt("Editar bloque:", b.label);
  if (nuevo === null || !nuevo.trim() || nuevo === b.label) return;
  await sb.from("week_blocks").update({ label: nuevo.trim() }).eq("id", b.id);
  cargar();
}

async function editarHorario(b) {
  const valida = (t) => /^([01]?\d|2[0-3]):[0-5]\d$/.test(t);
  const ini = prompt("Hora de inicio (HH:MM):", hhmm(b.start_time));
  if (ini === null) return;
  const fin = prompt("Hora de fin (HH:MM):", hhmm(b.end_time));
  if (fin === null) return;
  if (!valida(ini) || !valida(fin) || mins(fin) <= mins(ini)) { alert("Horario inválido."); return; }
  await sb.from("week_blocks").update({ start_time: ini, end_time: fin }).eq("id", b.id);
  cargar();
}

async function borrar(b) {
  if (!confirm(`¿Eliminar "${b.label}"?`)) return;
  await sb.from("week_blocks").delete().eq("id", b.id);
  cargar();
}

// ---------- RENDER ----------
function renderOverview() {
  const cont = $("overview");
  cont.innerHTML = "";
  const rango = (H_FIN - H_INI) * 60;
  for (const d of ORDEN) {
    const col = document.createElement("div");
    col.className = "ov-col" + (d === diaSel ? " on" : "");
    col.innerHTML = `<div class="d">${DIAS_CORTO[d]}</div><div class="track"></div>`;
    const track = col.querySelector(".track");
    for (const b of bloques.filter(x => x.weekday === d)) {
      const top = Math.max(0, (mins(b.start_time) - H_INI * 60) / rango) * 100;
      const fin = Math.min(rango, mins(b.end_time) - H_INI * 60) / rango * 100;
      const el = document.createElement("div");
      el.className = "ov-block";
      el.style.top = top + "%";
      el.style.height = Math.max(2, fin - top) + "%";
      el.style.background = ROLES[b.role].color;
      track.appendChild(el);
    }
    col.onclick = () => { diaSel = d; $("new-day").value = d; render(); };
    cont.appendChild(col);
  }
}

function renderDia() {
  const dia = bloques.filter(b => b.weekday === diaSel)
    .sort((a, b) => a.start_time.localeCompare(b.start_time));
  const horas = dia.reduce((acc, b) => acc + (mins(b.end_time) - mins(b.start_time)), 0) / 60;
  $("dia-titulo").querySelector("h2").textContent = DIAS[diaSel];
  $("dia-titulo").querySelector(".h").textContent =
    dia.length ? `${dia.length} bloques · ${horas % 1 ? horas.toFixed(1) : horas} h` : "sin bloques";

  const cont = $("lista-dia");
  cont.innerHTML = "";
  dia.forEach((b, i) => {
    const solapa = i > 0 && mins(b.start_time) < mins(dia[i - 1].end_time);
    const div = document.createElement("div");
    div.className = "bloque";
    div.style.borderLeftColor = ROLES[b.role].color;
    div.innerHTML = `
      <div class="hora" title="Editar horario">${hhmm(b.start_time)}<br>${hhmm(b.end_time)}</div>
      <div class="cuerpo">
        <div class="titulo">${esc(b.label)}</div>
        <div class="rol" style="color:${ROLES[b.role].color}">${ROLES[b.role].label}</div>
        ${solapa ? `<div class="solapa">⚠ se solapa con el bloque anterior</div>` : ""}
      </div>
      <button class="del">✕</button>`;
    div.querySelector(".hora").onclick = () => editarHorario(b);
    div.querySelector(".titulo").onclick = () => editarLabel(b);
    div.querySelector(".del").onclick = () => borrar(b);
    cont.appendChild(div);
  });
  if (!dia.length) cont.innerHTML = `<div class="card muted">Día libre en la plantilla.</div>`;
}

function render() { renderOverview(); renderDia(); }

async function cargar() {
  const { data, error } = await sb.from("week_blocks")
    .select("*").order("weekday").order("start_time");
  if (error) { alert(error.message); return; }
  bloques = data;
  const horasTotal = bloques.reduce((acc, b) => acc + (mins(b.end_time) - mins(b.start_time)), 0) / 60;
  $("resumen").textContent = bloques.length
    ? `${bloques.length} BLOQUES · ${horasTotal % 1 ? horasTotal.toFixed(1) : horasTotal} H PLANEADAS`
    : "PLANTILLA VACÍA · AGREGA TU PRIMER BLOQUE";
  render();
}

// ---------- ARRANQUE ----------
function show(id) {
  $("view-login").classList.add("hidden"); $("view-app").classList.add("hidden");
  $(id).classList.remove("hidden");
  $("navbar").classList.toggle("hidden", id === "view-login");
}

async function init() {
  show("view-app");
  $("new-day").innerHTML = ORDEN.map(d => `<option value="${d}">${DIAS[d]}</option>`).join("");
  $("new-day").value = diaSel;
  $("new-role").innerHTML = Object.entries(ROLES)
    .map(([k, r]) => `<option value="${k}">${r.label}</option>`).join("");
  $("leyenda").innerHTML = Object.values(ROLES)
    .map(r => `<span><i style="background:${r.color}"></i>${r.label}</span>`).join("");
  $("btn-add").onclick = addBlock;
  $("new-label").onkeydown = (e) => { if (e.key === "Enter") addBlock(); };
  cargar();
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  session ? init() : show("view-login");
})();

// PWA: registrar service worker
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
